    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
<header th:replace="~{layout/common :: header}"></header>

<section class="d-flex flex-column justify-content-center align-items-center text-center gap-2 main-intro-section">
    <img src="/images/logo/site-logo-only.png" width="65">
    <h1 class="fw-bold">
        회원가입
    </h1>
    <p class="text-secondary">
        멋사라이브와 함께 게임 커뮤니티를 즐겨보세요!
    </p>
</section>
<!-- "/register" 으로 입력값 전송-->
<div class="white-box">
    <form action="/member/requset:register" method="post" class="form-group">

        <div class="id-form">
            <label for="email">이메일(아이디)</label>
            <input type="text" name="email" id="email" placeholder="이메일을 입력하세요">
            <span style="opacity: 0.3">입력하신 이메일이 아이디로 사용됩니다.</span>
            <p></p>
        </div>

        <div class="password-form">
            <label for="password">비밀번호</label>
            <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요">
            <span style="opacity: 0.3">영문,숫자,특수문자를 포함한 8자 이상을 권장합니다.</span>
            <p></p>
        </div>

        <div class="nickname-form">
            <label for="nickname">닉네임</label>
            <input type="text" name="nickname" id="nickname" placeholder="닉네임을 입력하세요">
            <span style="opacity: 0.3">다른 사용자에게 표시되는 이름입니다.</span>
            <p></p>
        </div>

        <button type="submit" class="register-btn">회원가입</button>

    </form>
    <p>
        이미 계정이 있으신가요?
        <a href="/member/login">로그인하기</a>
    </p>
</div>
</body>
</html>
