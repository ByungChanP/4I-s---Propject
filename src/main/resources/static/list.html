</head>
<body>

        <a href="#" class="">

        </a>
        <a href="login.html" class="btn btn-orange">
            로그인
        </a>
    </div>

    <!--    </div>-->
</header>
<main class="px-4 py-4">
    <!--<section th:replace="~{layout/common :: intro}"></section>-->
    <section th:fragment="intro" class="container common-container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <img src="/images/lol/lol-banner.png" class="board-banner" >
            <div>
                <h3 class="fw-bold">
                    <span th:text="${game.gameTitle}">게임명</span>
                    파티 모집 게시판
                </h3>
                <p class="text-secondary fw-semibold">
                    파티원을 모집해보세요!
                </p>
            </div>
        </div>
            <a href="/profile.html" class="btn btn-outline-orange fw-semibold">
                인게임 프로필 등록
            </a>
    </section>
    <section class="container common-container py-4">
        <div class="row g-3">
            <aside class="col-2">
                <nav class="card  shadow-sm border-0">
                    <a href="#" class="text-decoration-none text-dark active-board fw-bold p-3">
                        파티모집
                    </a>
                </nav>
            </aside>
            <section class="col-10">
                <div class="bg-white rounded shadow-sm p-3 mb-3">
                    <form action="/" method="get" class="d-flex justify-content-between align-items-center">
                        <div class="d-flex gap-5">
                            <div>
                                <input type="text" name="keyword" placeholder="제목, 작성자 검색">
                                <button type="submit" class="btn btn-outline-orange">
                                    검색
                                </button>
                            </div>
                            <div class="d-flex gap-3">
                                <input type="radio"
                                       class="btn-check"
                                       name="type"
                                       id="all"
                                       value="all"
                                       checked>

                                <label class="btn btn-outline-orange" for="all">
                                    전체
                                </label>

                                <input type="radio"
                                       class="btn-check"
                                       name="type"
                                       id="rank"
                                       value="rank">

                                <label class="btn btn-outline-orange" for="rank">
                                    랭크
                                </label>

                                <input type="radio"
                                       class="btn-check"
                                       name="type"
                                       id="normal"
                                       value="normal">

                                <label class="btn btn-outline-orange" for="normal">
                                    일반
                                </label>
                            </div>
                        </div>
                        <div class="d-flex gap-3">
                            <select name="status">
                                <option value="">
                                    모집중
                                </option>
                                <option value="closed">
                                    마감
                                </option>
                            </select>
                            <a href="./leagueoflegend/write_post" class="btn btn-orange">
                                글쓰기
                            </a>
                        </div>
                    </form>
                </div>
                <div class="bg-white rounded shadow-sm">
                    <table class="table align-middle mb-0 board-table">
                        <thead class="table-light ">
                        <tr>
                            <th class="text-secondary">제목</th>
                            <th class="text-secondary">카테고리</th>
                            <th class="text-secondary">작성자</th>
                            <th class="text-secondary">지원인원/모집정원</th>
                            <th class="text-secondary">마감시간</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr >
                            <td>
                                <a href="./leagueoflegend/detail" class="text-decoration-none text-dark fw-semibold">
                                    제목(예시: 다이아 이상 파티원 모집합니다~)
                                </a>
                            </td>
                            <td>
                                <span class="btn border-warning bg-white fw-semibold">등급</span>
                            </td>
                            <td>
                                <div>
                                    <img src="images/icon/person-circle.svg">
                                    <span class="text-secondary">
                                     게시판 닉네임(인게임 닉네임X)
                                 </span>
                                </div>
                            </td>
                            <td>
                             <span>
                                 현재참여정원
                             </span>
                                /
                                <span>
                                 마감정원
                             </span>
                            </td>
                            <td>
                             <span>
                                 마감까지 남은 시간
                             </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="bg-white justify-content-center p-2">
                    <ul class="pagination justify-content-center ">
                        <li class="page-item">
                            <a href="#"
                               class="page-link">
                                ‹
                            </a>
                        </li>

                        <li class="page-item active">
                            <a href="#"
                               class="page-link">
                                1
                            </a>
                        </li>
                        <li class="page-item">
                            <a href="#"
                               class="page-link">
                                ›
                            </a>
                        </li>
                    </ul>
                </nav>
            </section>
        </div>
    </section>
</main>
</body>
</html>
