<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>멋사라이브</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<header th:replace="~{layout/common :: header}"></header>
<main class="main-container">
    <section class="d-flex flex-column justify-content-center align-items-center text-center gap-2 main-intro-section">
        <img src="/images/logo/site-logo-only.png" width="65">
        <h1 class="fw-bold">
            멋사라이브
        </h1>
        <p class="text-secondary">
            관심있는 게임을 선택하여 커뮤니티에 참여해보세요!
        </p>
    </section>
    <section class="container">
        <nav class="row g-3">
            <div class="col-4" th:each="game : ${games}">
                <div class="card shadow-sm game-card">
                    <img th:src="${game.getBackgroundImgDir()}" alt=""
                         class="game-banner overflow-hidden card-img-top w-100">
                    <a th:href="|/board/${game.id}|" class="text-decoration-none text-dark">
                        <div class="card-body d-flex align-items-center gap-3">
                            <img th:src="${game.getLogoImgDir()}" alt="" class="game-icon">
                            <div>
                                <h5 class="fw-bold mb-1" th:text="${game.gameTitle}">
                                    게임 명(예시 : 리그 오브 레전드)
                                </h5>
                                <p th:text="${game.details}">
                                    게임 설명(예시 : 전략과 팀워크가 빛나는 MOBA의 정석)
                                </p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </nav>
    </section>
</main>
</body>
</html>
