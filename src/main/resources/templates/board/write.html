<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/write.css}">
    <title>게시글 작성</title>
</head>

<body>

<!-- 배너 -->
<header>
    <img th:src="@{/images/logo/site-logo.png}"
         alt="멋사라이브 로고"
         width="10%"
         height="auto">

    <div class="user-menu">
        <img th:src="@{/images/profile/default-profile.png}"
             alt="유저 기본프로필 이미지">

        <p>
            안녕하세요,
            <span th:text="${loginUser != null ? loginUser.nickname : '사용자'}">
                사용자
            </span>님!
            <a th:href="@{/logout}">로그아웃</a>
        </p>
    </div>
</header>

<div class="board_info">
    <img th:src="@{/images/lol/lol-banner.png}"
         alt="리그오브레전드 배너이미지"
         width="230">

    <h1>리그오브레전드 파티 모집 게시판</h1>
</div>

<hr>

<form th:action="@{/board/leagueoflegend/request:post}"
      th:object="${postDto}"
      method="post">

    <div class="form-group">
        <label>모집유형 :</label>

        <input type="radio"
               id="rank"
               th:field="*{tag}"
               value="rank">
        <label for="rank">랭크</label>

        <input type="radio"
               id="normal"
               th:field="*{tag}"
               value="normal">
        <label for="normal">일반</label>
    </div>

    <!-- 모집 인원 -->
    <div class="form-group">
        <label for="memberCount">파티 모집 인원 선택 :</label>

        <select id="memberCount"
                th:field="*{maxParticipantCount}">
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
            <option value="5">5명</option>
        </select>

        <div class="field-error"
             th:if="${#fields.hasErrors('maxParticipantCount')}"
             th:errors="*{maxParticipantCount}">
        </div>
    </div>

    <!-- 랭크 (추후 DTO 추가 예정) -->
    <div class="form-group">
        <label>인게임 랭크 :</label>

        <select th:field="*{minRank}">
            <option value="iron">아이언</option>
            <option value="bronze">브론즈</option>
            <option value="silver">실버</option>
            <option value="gold">골드</option>
            <option value="platinum">플래티넘</option>
            <option value="emerald">에메랄드</option>
            <option value="diamond">다이아몬드</option>
            <option value="master">마스터</option>
            <option value="grandmaster">그랜드마스터</option>
            <option value="challenger">챌린저</option>
        </select>

        이상

        <select th:field="*{maxRank}">
            <option value="iron">아이언</option>
            <option value="bronze">브론즈</option>
            <option value="silver">실버</option>
            <option value="gold">골드</option>
            <option value="platinum">플래티넘</option>
            <option value="emerald">에메랄드</option>
            <option value="diamond">다이아몬드</option>
            <option value="master">마스터</option>
            <option value="grandmaster">그랜드마스터</option>
            <option value="challenger">챌린저</option>
        </select>

        이하
    </div>

    <!-- 모집 마감 시간 -->
    <div class="form-group">
        <label for="deadline">파티 모집 마감 시간 :</label>

        <input type="datetime-local"
               id="deadline"
               th:field="*{deadline}">

        <div class="field-error"
             th:if="${#fields.hasErrors('deadline')}"
             th:errors="*{deadline}">
        </div>
    </div>

    <!-- 제목 -->
    <div class="form-group">
        <label for="title">게시글 제목</label>

        <input type="text"
               id="title"
               th:field="*{title}"
               placeholder="제목을 입력하세요">

        <div class="field-error"
             th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}">
        </div>
    </div>

    <!-- 내용 -->
    <div class="form-group">
        <label for="content">게시글 내용</label>

        <textarea id="content"
                  th:field="*{content}"
                  rows="15"
                  placeholder="모집 조건, 포지션, 디스코드 여부 등을 자유롭게 작성해주세요"></textarea>

        <div class="field-error"
             th:if="${#fields.hasErrors('content')}"
             th:errors="*{content}">
        </div>
    </div>

    <!-- 버튼 -->
    <div class="button-group">
        <a th:href="@{/board/leagueoflegend}">취소</a>
        <button type="submit">등록</button>
    </div>

</form>

</body>
</html>
