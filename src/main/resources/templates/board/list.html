<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록 조회 페이지</title>
</head>
<body>
<header>
    <img src="./../../static/images/logo/site-logo.png" alt="멋사라이브 로고" width="160px" height="90px">
    <div>
        <img src="" alt="유저 기본프로필 이미지">
        <p>안녕하세요, 사용자님!</p>
    </div>
    <a href="">로그아웃</a>
</header>
<main>
    <section>
    </section>
    <div>
        <aside>
            <nav>
                <a href="#">
                    파티모집
                </a>
            </nav>
        </aside>
        <section>
            <div>
                <form method="get">
                    <input type="text" name="keyword" placeholder="제목, 작성자 검색">
                    <button type="submit">
                        검색
                    </button>
                </form>
                <div>
                    <a href="#">
                        전체
                    </a>
                    <a href="#">
                        랭크
                    </a>
                    <a href="#">
                        일반
                    </a>
                </div>
                <div>
                    <select name="status">
                        <option value="">
                            모집중
                        </option>
                        <option value="closed">
                            마감
                        </option>
                    </select>
                    <a href="./leagueoflegend/write_post">
                        글쓰기
                    </a>
                </div>
            </div>

            <div>
                <table>
                    <thead>
                    <tr>
                        <th>제목</th>
                        <th>카테고리</th>
                        <th>작성자</th>
                        <th>지원인원/모집정원</th>
                        <th>마감시간</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>
                            <a href="./leagueoflegend/detail">
                                제목
                            </a>
                        </td>
                        <td>
                            <span>등급</span>
                        </td>
                        <td>
                            <div>
                                <img src="profile-img.png">
                                <span>
                                     게시판 닉네임(인게임 닉네임X)
                                 </span>
                            </div>
                        </td>
                        <td>
                             <span>
                                 현재참여정원
                             </span>
                            /
                            <span>
                                 마감정원
                             </span>
                        </td>
                        <td>
                             <span>
                                 마감까지 남은 시간
                             </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav>
                <a href="이전 페이지이동">
                    <
                </a>
                <a href="페이지번호">
                    1
                </a>
                <a href="다음 페이지이동">
                    >
                </a>
            </nav>
        </section>
    </div>
</main>
</body>
</html>
