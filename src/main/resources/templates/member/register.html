<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>멋사라이브 로그인</title>
    <link rel="stylesheet" href="../../static/css/login.css">
</head>
<body>
<header>
    <h1 class="Header">
        <!-- 로고 클릭시 메인 화면으로 이동-->
        <a href="/main.html">
            <img src= "/images/logo/site-logo.png" alt="멋사라이브">
        </a>
        <!-- 버튼 클릭시 메인 화면으로 이동-->
        <a href="/main.html" class="Home-btn">홈으로 </a>
    </h1>
</header>

<div class="Top" >
    <img src="/images/logo/site-logo-only.png" alt="멋사라이브">
    <h2>로그인</h2>
    <p1>멋사라이브에 오신 것을 환영합니다.</p1>
</div>

<!-- "/register" 으로 입력값 전송-->
<form action="/register" method="post">
    <div class="login-form">
        <label for="email">이메일(아이디)</label>
        <input type="text" name="UserEmail" id="email" placeholder="이메일을 입력하세요">
    </div>
    <div class="password-form">
        <label for="password">비밀번호</label>
        <input type="password" name="UserPassword" id="password" placeholder="비밀번호를 입력하세요">
    </div>
    <div class="nickname-form">
        <label for="nickname">닉네임</label>
        <input type="text" name="Usernickname" id="nickname" placeholder="닉네임을 입력하세요">
    </div>
    <button type="submit" class="register-btn">회원가입</button>
</form>
<p>
    이미 계정이 있으신가요?
    <a href="login.html">로그인하기</a>
</p>

</body>
</html>
