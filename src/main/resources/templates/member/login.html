<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>멋사라이브 로그인</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<header th:replace="~{layout/common :: header}"></header>
<section class="d-flex flex-column justify-content-center align-items-center text-center gap-2 main-intro-section">
    <img src="/images/logo/site-logo-only.png" width="65">
    <h1 class="fw-bold">
        로그인
    </h1>
    <p class="text-secondary">
        멋사라이브에 오신 것을 환영합니다!
    </p>
</section>
<!-- "/login" 으로 입력값 전송-->
<div class="white-box">
    <form action="./login" method="post" class="form-group">
        <div class="id-form">
            <label for="email">이메일(아이디)</label>
            <input type="text" name="email" id="email" placeholder="이메일을 입력하세요">
        </div>
        <div class="password-form">
            <label for="password">비밀번호</label>
            <input type="password" name="password" id="password" placeholder="비밀번호를 입력하세요">
        </div>
        <button type="submit" class="login-btn">로그인</button>
    </form>
    <div>또는</div>
    <a href="/member/register">
        <button type="button" class="register-btn">회원가입</button>
    </a>
</div>
</body>
</html>
