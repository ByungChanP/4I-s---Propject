<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>멋사라이브 로그인</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<header>
    <div class="Header">
        <!-- 로고 클릭시 메인 화면으로 이동-->
        <a href="/main.html">
            <img src="/images/logo/site-logo.png" class="logotomain" alt="멋사라이브">
        </a>
        <!-- 버튼 클릭시 메인 화면으로 이동-->
        <a href="/main.html" class="Home-btn"> 홈으로 </a>
    </div>
</header>

<div class="Top" >
    <img src="/images/logo/site-logo-only.png" alt="멋사라이브">
    <h2>로그인</h2>
    <p1>멋사라이브에 오신 것을 환영합니다.</p1>
</div>

<!-- "/login" 으로 입력값 전송-->
<form action="/login" method="post">
    <div class="login-form">
        <label for="email">이메일(아이디)</label>
        <input type="text" name="UserEmail" id="email" placeholder="이메일을 입력하세요">
    </div>
    <div class="password-form">
        <label for="password">비밀번호</label>
        <input type="password" name="UserPassword" id="password" placeholder="비밀번호를 입력하세요">
    </div>
    <button type="submit" class="login-btn">로그인</button>
</form>

<span>또는</span>

<div>
    <a href="register.html">
        <button type="button">회원가입</button>
    </a>
</div>
</body>
</html>
